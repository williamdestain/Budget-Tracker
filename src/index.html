<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BudgetTracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Polices du design system (voir styles.scss, --font-display / --font-body).
       Chargées en CDN pour l'instant ; à auto-héberger (@fontsource) une fois
       la refonte visuelle en production, pour ne pas dépendre d'un tiers. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Applique le thème avant qu'Angular ne démarre, pour éviter un flash
    // du thème clair au chargement quand l'utilisateur a choisi le sombre
    // (ThemeService fait la même chose, mais après le premier rendu).
    (function () {
      try {
        var saved = localStorage.getItem('budget-tracker:theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
