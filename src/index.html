<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BudgetTracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // Applique le thème avant qu'Angular ne démarre, pour éviter un flash
    // du thème clair au chargement quand l'utilisateur a choisi le sombre
    // (ThemeService fait la même chose, mais après le premier rendu).
    (function () {
      try {
        var saved = localStorage.getItem('budget-tracker:theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
