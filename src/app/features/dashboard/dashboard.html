<div class="wrap">
  <header>
    <div class="title-row">
      <h1><span class="logo">💰</span> Traqueur de Budget</h1>
      <button class="btn-primary" (click)="logout()">Se déconnecter</button>
    </div>

    <div class="tabs">
      <button
        class="tab"
        [class.active]="store.activeOwner() === 'moi'"
        (click)="setOwner('moi')"
      >
        Moi
      </button>
      <button
        class="tab"
        [class.active]="store.activeOwner() === 'madame'"
        (click)="setOwner('madame')"
      >
        Madame
      </button>
      <button
        class="tab"
        [class.active]="store.activeOwner() === 'global'"
        (click)="setOwner('global')"
      >
        Global
      </button>
    </div>

    <div class="header-actions">
      <app-data-management />
    </div>
  </header>

  @if (store.loading()) {
    <p class="placeholder">Chargement des données…</p>
  } @else {
    <div class="period-budget-grid">
      <div class="card period-card">
        <div class="card-title">Période</div>
        <div class="month-nav">
          <button class="icon-btn" (click)="prevMonth()" title="Mois précédent">‹</button>
          <span class="month-label">{{ monthLabel }}</span>
          <button class="icon-btn" (click)="nextMonth()" title="Mois suivant">›</button>
        </div>
        <button
          class="seg close-month-btn"
          (click)="closeMonth()"
          title="Reporter le solde net de ce mois vers le mois suivant"
        >
          🔒 Clôturer le mois
        </button>
      </div>
      <app-budget-progress />
    </div>

    <app-income-bar />
    <app-smart-alerts />
    <app-month-forecast />

    <app-income-list />
    <app-income-form />

    <app-upcoming-provisions />
    <app-provision-form />
    <app-provision-list />
    <app-versement-splitter />

    <app-savings-goal-list />

    <app-category-budgets />
    <app-expense-form />
    <app-expected-this-month />
    <app-recurring-expenses-manage />

    <app-month-comparison />
    <app-yearly-view />

    <div class="chart-expenses-grid">
      <app-spending-chart />
      <app-expense-list />
    </div>

    <app-credit-card />
  }
</div>
