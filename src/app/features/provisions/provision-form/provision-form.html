<div class="card prov-form-card">
  <button type="button" class="btn-primary toggle-btn" (click)="toggle()">
    {{ open() ? '− Fermer' : '+ Nouvelle provision' }}
  </button>

  @if (open()) {
    <form class="prov-form" (ngSubmit)="submit()">
      <div class="prov-form-row">
        <div class="field">
          <label for="prov-name">Nom</label>
          <input id="prov-name" type="text" name="name" [(ngModel)]="name" placeholder="Ex. Électricité" required />
        </div>

        <div class="field">
          <label for="prov-category">Catégorie liée</label>
          <select id="prov-category" name="category" [(ngModel)]="category" required>
            @for (c of categories; track c) {
              <option [value]="c">{{ c }}</option>
            }
          </select>
        </div>

        <div class="field">
          <label for="prov-amount">Montant à économiser</label>
          <div class="input-money">
            <input id="prov-amount" type="number" min="0" step="0.01" name="amount" [(ngModel)]="amount" placeholder="Ex. 900" />
          </div>
          <span class="prov-field-hint">Rien n'est prélevé automatiquement : tu alimentes toi-même la provision avec le bouton +$ après sa création, jusqu'à atteindre ce montant.</span>
        </div>

        <div class="field">
          <label for="prov-unit">Type d'échéance</label>
          <select id="prov-unit" name="intervalUnit" [(ngModel)]="intervalUnit">
            <option value="months">Tous les N mois</option>
            <option value="days">Tous les ~N jours</option>
          </select>
        </div>

        <div class="field">
          <label for="prov-every">{{ intervalUnit === 'days' ? "Dans combien de jours l'avoir" : "Dans combien de mois l'avoir" }}</label>
          <input id="prov-every" type="number" min="1" step="1" name="everyN" [(ngModel)]="everyN" placeholder="3" required />
        </div>

        @if (intervalUnit === 'months') {
          <div class="field">
            <label for="prov-start">Début du cycle</label>
            <input id="prov-start" type="month" name="startYM" [(ngModel)]="startYM" required />
          </div>
        } @else {
          <div class="field">
            <label for="prov-start-date">Départ du cycle</label>
            <input id="prov-start-date" type="date" name="startDate" [(ngModel)]="startDate" required />
          </div>
        }

        <div class="field-actions">
          <button type="submit" class="btn-primary" [disabled]="saving()">Créer</button>
        </div>
      </div>
    </form>
  }
</div>
