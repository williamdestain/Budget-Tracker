<svg
  viewBox="0 0 24 24"
  [attr.width]="size()"
  [attr.height]="size()"
  fill="none"
  stroke="currentColor"
  [attr.stroke-width]="strokeWidth()"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  @switch (name()) {
    @case ('close') {
      <line x1="6" y1="6" x2="18" y2="18" />
      <line x1="6" y1="18" x2="18" y2="6" />
    }
    @case ('alert') {
      <path d="M12 3.5l9.5 16.5h-19z" />
      <line x1="12" y1="9.5" x2="12" y2="14" />
      <circle cx="12" cy="16.8" r="0.6" fill="currentColor" stroke="none" />
    }
    @case ('edit') {
      <path
        d="M4 20l1-4 11.5-11.5a1.5 1.5 0 0 1 2 0l1.5 1.5a1.5 1.5 0 0 1 0 2L8.5 19.5 4 20z"
      />
    }
    @case ('check') {
      <path d="M4 12l5 5 11-11" />
    }
    @case ('check-circle') {
      <circle cx="12" cy="12" r="9" />
      <path d="M8 12.5l2.5 2.5L16 9.5" />
    }
    @case ('card') {
      <rect x="2" y="5" width="20" height="14" rx="2.5" />
      <line x1="2" y1="10" x2="22" y2="10" />
    }
    @case ('arrow-right') {
      <line x1="4" y1="12" x2="19" y2="12" />
      <path d="M13 6l6 6-6 6" />
    }
    @case ('arrow-left') {
      <line x1="20" y1="12" x2="5" y2="12" />
      <path d="M11 6l-6 6 6 6" />
    }
    @case ('calendar') {
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <line x1="3" y1="10" x2="21" y2="10" />
      <line x1="8" y1="3" x2="8" y2="7" />
      <line x1="16" y1="3" x2="16" y2="7" />
    }
    @case ('dot') {
      <circle cx="12" cy="12" r="6" fill="currentColor" stroke="none" />
    }
    @case ('undo') {
      <path d="M7 10H4V6" />
      <path d="M4 10a8 8 0 1 1 2.3 6.3" />
    }
    @case ('trash') {
      <path d="M4 7h16" />
      <path d="M9 7V4h6v3" />
      <path d="M6 7l1 13h10l1-13" />
    }
    @case ('tag') {
      <path d="M20 13.5 12.5 21 3 11.5V3h8.5z" />
      <circle cx="7.5" cy="7.5" r="1.4" fill="currentColor" stroke="none" />
    }
    @case ('flag') {
      <path d="M5 21V4" />
      <path d="M5 4h13l-3 4 3 4H5" />
    }
    @case ('lock') {
      <rect x="5" y="11" width="14" height="9" rx="2" />
      <path d="M8 11V7a4 4 0 0 1 8 0v4" />
    }
    @case ('unlock') {
      <rect x="5" y="11" width="14" height="9" rx="2" />
      <path d="M8 11V7a4 4 0 0 1 7.5-1.2" />
    }
    @case ('money') {
      <rect x="2" y="6" width="20" height="12" rx="2" />
      <circle cx="12" cy="12" r="3" />
    }
    @case ('target') {
      <circle cx="12" cy="12" r="8.5" />
      <circle cx="12" cy="12" r="5" />
      <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none" />
    }
    @case ('repeat') {
      <path d="M4 7h13l-3-3" />
      <path d="M20 17H7l3 3" />
    }
    @case ('save') {
      <path d="M5 4h11l3 3v13H5z" />
      <path d="M8 4v6h8V4" />
      <path d="M8 15h8v5H8z" />
    }
    @case ('chart') {
      <rect x="4" y="12" width="3.6" height="8" rx="0.6" />
      <rect x="10.2" y="7" width="3.6" height="13" rx="0.6" />
      <rect x="16.4" y="3" width="3.6" height="17" rx="0.6" />
    }
    @case ('trending') {
      <path d="M3 17l6-6 4 4 8-8" />
      <path d="M15 7h6v6" />
    }
    @case ('settings') {
      <circle cx="12" cy="12" r="3" />
      <path
        d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"
      />
    }
    @case ('sun') {
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
      />
    }
    @case ('moon') {
      <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" />
    }
    @case ('home') {
      <path d="M4 11l8-7 8 7" />
      <path d="M6 10v9h12v-9" />
    }
    @case ('dashboard') {
      <line x1="4" y1="7" x2="20" y2="7" />
      <line x1="4" y1="12" x2="15" y2="12" />
      <line x1="4" y1="17" x2="19" y2="17" />
    }
    @case ('transactions') {
      <path d="M7 3v15" />
      <path d="M4 6l3-3 3 3" />
      <path d="M17 21V6" />
      <path d="M14 18l3 3 3-3" />
    }
    @case ('envelope') {
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <path d="M3.5 6.5L12 13l8.5-6.5" />
    }
    @case ('wallet') {
      <rect x="3" y="6" width="18" height="13" rx="2.5" />
      <path d="M3 10h18" />
      <circle cx="17" cy="14.5" r="1.1" fill="currentColor" stroke="none" />
    }
    @case ('users') {
      <circle cx="9" cy="8" r="3" />
      <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" />
      <circle cx="17" cy="9" r="2.4" />
      <path d="M15.5 13.2c2.6.4 4.5 2.4 4.5 4.8" />
    }
    @case ('plus') {
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    }
    @case ('chevron-left') {
      <path d="M15 6l-6 6 6 6" />
    }
    @case ('chevron-right') {
      <path d="M9 6l6 6-6 6" />
    }
  }
</svg>
