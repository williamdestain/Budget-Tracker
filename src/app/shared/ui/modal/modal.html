<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div
    #panel
    class="modal-panel"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    tabindex="-1"
  >
    <div class="modal-head">
      <h3>{{ title() }}</h3>
      <button type="button" class="modal-close" aria-label="Fermer" (click)="closed.emit()">
        <app-icon name="close" [size]="16" />
      </button>
    </div>
    <div class="modal-body">
      <ng-content></ng-content>
    </div>
  </div>
</div>
